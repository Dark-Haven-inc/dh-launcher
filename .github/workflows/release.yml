name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
      publish:
        description: 'Publish it (off: only build; the packages become artifacts of the run)'
        type: boolean
        default: true
      only_linux:
        description: 'Only the Linux build: add it to an existing release whose Linux job failed'
        type: boolean
        default: false

# A tag always publishes; a manual run can build without releasing anything, to try the workflow.
env:
  PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.only_linux }}
    runs-on: windows-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets

    env:
      GH_TOKEN: ${{ github.token }}
      # Players download and update from here: a public repo that holds nothing but releases, so this
      # source repo can be private. Writing to it needs the RELEASES_TOKEN secret (docs/RELEASING.md).
      RELEASE_REPO: Dark-Haven-inc/frontier15-launcher
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

    steps:
      # Fail in the first seconds, not after the build, if the token can't write releases. Reading
      # proves nothing (the repo is public); generate-notes needs Contents: write and creates nothing.
      - name: Check the releases-repo token
        shell: bash
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN is missing: it must be able to write releases to $RELEASE_REPO (docs/RELEASING.md)."
            exit 1
          fi
          GH_TOKEN="$RELEASES_TOKEN" gh api -X POST "repos/$RELEASE_REPO/releases/generate-notes" \
              -f tag_name=v0.0.0-token-check --jq .name > /dev/null \
            || { echo "::error::RELEASES_TOKEN can't write releases to $RELEASE_REPO: not approved by an org owner yet, expired, or scoped to the wrong repo."; exit 1; }

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore tools
        run: dotnet tool restore

      # The forked Dark Haven engine is not in git (large, build-specific). It lives as assets on
      # the `engine-bundles` release in this repo; pull every file it references. manifest.json
      # names the file(s) and pins their SHA-256, which pack-release.ps1 re-checks.
      - name: Fetch bundled engine(s)
        shell: bash
        run: |
          mkdir -p src/DarkHaven.App/bundled-engines
          # Only the files manifest.json names: the release keeps older engines around, and every zip in
          # the folder would otherwise ship inside the launcher.
          for f in $(jq -r '.[] | .file, (.platforms // {} | .[] | .file)' src/DarkHaven.App/bundled-engines/manifest.json); do
            gh release download engine-bundles \
              --repo "${{ github.repository }}" \
              --dir src/DarkHaven.App/bundled-engines \
              --pattern "$f" --clobber
          done
          echo "Bundled engines present:"
          ls -lh src/DarkHaven.App/bundled-engines/*.zip

      # Prior releases in the delta channel, so vpk can build a delta from the last version. The
      # releases repo is empty until its first release; then the last release is still here, in the
      # source repo, and that's the version players are on.
      - name: Fetch previous releases
        shell: bash
        run: |
          mkdir -p artifacts/releases
          dotnet vpk download github \
            --repoUrl "https://github.com/$RELEASE_REPO" \
            --channel win \
            --outputDir artifacts/releases \
            --token "$RELEASES_TOKEN" || true
          if [ ! -f artifacts/releases/releases.win.json ]; then
            echo "Nothing in $RELEASE_REPO yet: taking the previous release from ${{ github.repository }}"
            dotnet vpk download github \
              --repoUrl "https://github.com/${{ github.repository }}" \
              --channel win \
              --outputDir artifacts/releases \
              --token "${{ github.token }}" || echo "no prior release yet — first cut"
          fi

      # DH_LAUNCH_SIGNING_KEY: the launch-proof signing key (`dhlauncher launch-key`). Without it the release still
      # builds, but signs nothing, and Frontier 15 servers enforcing the launcher check turn its players away.
      - name: Pack release
        env:
          DH_LAUNCH_SIGNING_KEY: ${{ secrets.DH_LAUNCH_SIGNING_KEY }}
        run: pwsh scripts/pack-release.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Drop stale full packages
        shell: bash
        run: |
          find artifacts/releases -name '*-full.nupkg' \
            ! -name "*-${{ steps.v.outputs.version }}-full.nupkg" -delete || true

      - name: Keep the packages (build-only run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: artifacts/releases/

      - name: Publish to the releases repo
        if: env.PUBLISH == 'true'
        run: >
          dotnet vpk upload github
          --repoUrl https://github.com/${{ env.RELEASE_REPO }}
          --publish
          --releaseName "Frontier 15 Launcher ${{ steps.v.outputs.version }}"
          --tag v${{ steps.v.outputs.version }}
          --channel win
          --token ${{ env.RELEASES_TOKEN }}
          --outputDir artifacts/releases

      # Launchers up to 0.3.4 update from THIS repo. While it's public, publish here too, so they
      # reach a version that reads the releases repo. Runs after the releases repo on purpose: an old
      # launcher only moves over once the new feed already has the release. Once this repo is
      # private, old launchers can't read it anyway, and the step does nothing.
      - name: Mirror to this repo while it is public
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" = "true" ]; then
            echo "${{ github.repository }} is private: nothing to mirror."
            exit 0
          fi
          dotnet vpk upload github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --publish \
            --releaseName "Frontier 15 Launcher ${{ steps.v.outputs.version }}" \
            --tag "v${{ steps.v.outputs.version }}" \
            --channel win \
            --token "${{ github.token }}" \
            --outputDir artifacts/releases

  # The Linux build: a Velopack AppImage on the same GitHub release, channel "linux". Runs after the
  # Windows job, which creates the release; this one adds its files to it (--merge). The bundled
  # engine needs a linux-x64 build in manifest.json ("platforms"), or pack-release.ps1 stops here.
  release-linux:
    needs: release
    # With only_linux the Windows job is skipped on purpose and this one still runs.
    if: ${{ !cancelled() && (needs.release.result == 'success' || (inputs.only_linux && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPO: Dark-Haven-inc/frontier15-launcher
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # vpk builds the AppImage with mksquashfs.
      - name: Install squashfs-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore tools
        run: dotnet tool restore

      - name: Fetch bundled engine(s)
        shell: bash
        run: |
          mkdir -p src/DarkHaven.App/bundled-engines
          # Only the files manifest.json names: the release keeps older engines around, and every zip in
          # the folder would otherwise ship inside the launcher.
          for f in $(jq -r '.[] | .file, (.platforms // {} | .[] | .file)' src/DarkHaven.App/bundled-engines/manifest.json); do
            gh release download engine-bundles \
              --repo "${{ github.repository }}" \
              --dir src/DarkHaven.App/bundled-engines \
              --pattern "$f" --clobber
          done
          ls -lh src/DarkHaven.App/bundled-engines/*.zip

      - name: Fetch previous releases
        shell: bash
        run: |
          mkdir -p artifacts/releases
          dotnet vpk download github \
            --repoUrl "https://github.com/$RELEASE_REPO" \
            --channel linux \
            --outputDir artifacts/releases \
            --token "$RELEASES_TOKEN" || echo "no prior Linux release yet — first cut"

      - name: Pack release
        shell: pwsh
        env:
          DH_LAUNCH_SIGNING_KEY: ${{ secrets.DH_LAUNCH_SIGNING_KEY }}
        run: ./scripts/pack-release.ps1 -Version ${{ steps.v.outputs.version }} -Rid linux-x64

      - name: Drop stale full packages
        shell: bash
        run: |
          # The channel is in the name here: Frontier15Launcher-<version>-linux-full.nupkg.
          find artifacts/releases -name '*-full.nupkg' \
            ! -name "*-${{ steps.v.outputs.version }}-linux-full.nupkg" -delete || true
          ls artifacts/releases/*-${{ steps.v.outputs.version }}-linux-full.nupkg

      - name: Keep the packages (build-only run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: artifacts/releases/

      - name: Add to the release in the releases repo
        if: env.PUBLISH == 'true'
        run: >
          dotnet vpk upload github
          --repoUrl https://github.com/${{ env.RELEASE_REPO }}
          --publish
          --merge
          --releaseName "Frontier 15 Launcher ${{ steps.v.outputs.version }}"
          --tag v${{ steps.v.outputs.version }}
          --channel linux
          --token ${{ env.RELEASES_TOKEN }}
          --outputDir artifacts/releases

      # The one-line installer players run: curl -fsSL …/releases/latest/download/install.sh | sh
      - name: Attach install.sh
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          GH_TOKEN="$RELEASES_TOKEN" gh release upload "v${{ steps.v.outputs.version }}" scripts/install.sh \
            --repo "$RELEASE_REPO" --clobber
