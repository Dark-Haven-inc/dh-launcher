name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore tools
        run: dotnet tool restore

      # The forked Dark Haven engine is not in git (large, build-specific). Fetch it from the
      # secret so releases actually ship a connectable engine. Skipped if the secret is absent —
      # the build still produces an installer, just without a bundled engine.
      - name: Fetch bundled engine
        if: ${{ secrets.BUNDLED_ENGINE_URL != '' }}
        shell: bash
        run: |
          mkdir -p src/DarkHaven.App/bundled-engines
          curl -fsSL "${{ secrets.BUNDLED_ENGINE_URL }}" -o src/DarkHaven.App/bundled-engines/engine.zip
          echo "Fetched $(du -h src/DarkHaven.App/bundled-engines/engine.zip | cut -f1) engine bundle"

      - name: Pack release
        run: pwsh scripts/pack-release.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Publish to GitHub Releases
        run: >
          dotnet vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --publish
          --releaseName "Dark Haven Launcher ${{ steps.v.outputs.version }}"
          --tag v${{ steps.v.outputs.version }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir artifacts/releases
