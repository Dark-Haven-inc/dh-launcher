name: ЛОКАЛКА check

# The local-server code on both systems the launcher ships for: the unit tests, then a real server from the
# published builds (LocalServerLiveTests — downloads ~1 GB, starts it, stops it). Runs on pushes to local-server
# branches and by hand (Actions → ЛОКАЛКА check → Run workflow), e.g. after publishing a new local build.
on:
  push:
    branches: ['feature/local-*']
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests (ЛОКАЛКА)
        run: dotnet test tests/DarkHaven.Launcher.Tests -c Release --filter "FullyQualifiedName~LocalServerTests" --logger "console;verbosity=normal"

      - name: A real local server
        env:
          DH_LOCAL_E2E: '1'
        run: dotnet test tests/DarkHaven.Launcher.Tests -c Release --no-build --filter "FullyQualifiedName~LocalServerLiveTests" --logger "console;verbosity=normal"
