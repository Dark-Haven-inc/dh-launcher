name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore tools
        run: dotnet tool restore

      # The forked Dark Haven engine is not in git (large, build-specific). It lives as assets on
      # the `engine-bundles` release in this repo; pull every file it references. manifest.json
      # names the file(s) and pins their SHA-256, which pack-release.ps1 re-checks.
      - name: Fetch bundled engine(s)
        shell: bash
        run: |
          mkdir -p src/DarkHaven.App/bundled-engines
          gh release download engine-bundles \
            --repo "${{ github.repository }}" \
            --dir src/DarkHaven.App/bundled-engines \
            --pattern '*.zip' --clobber
          echo "Bundled engines present:"
          ls -lh src/DarkHaven.App/bundled-engines/*.zip

      # Prior releases in the delta channel, so vpk can build a delta from the last version.
      - name: Fetch previous releases
        shell: bash
        run: |
          mkdir -p artifacts/releases
          dotnet vpk download github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --channel win \
            --outputDir artifacts/releases \
            --token "${{ github.token }}" || echo "no prior release yet — first cut"

      - name: Pack release
        run: pwsh scripts/pack-release.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Drop stale full packages
        shell: bash
        run: |
          find artifacts/releases -name '*-full.nupkg' \
            ! -name "*-${{ steps.v.outputs.version }}-full.nupkg" -delete || true

      - name: Publish to GitHub Releases
        run: >
          dotnet vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --publish
          --releaseName "Frontier 15 Launcher ${{ steps.v.outputs.version }}"
          --tag v${{ steps.v.outputs.version }}
          --channel win
          --token ${{ github.token }}
          --outputDir artifacts/releases
